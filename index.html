<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11511 護理班表管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FCFBF7',
                            100: '#F7F4EB',
                            200: '#EFEAD8',
                            300: '#E2D8BE',
                            400: '#C2B08B',
                            500: '#A38E62',
                        },
                        amberSoft: '#FAF3E0',
                        accentDark: '#4A3E31'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #F7F4EB;
            color: #4A3E31;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .cream-card {
            background-color: #FFFFFF;
            border: 1px solid #EFEAD8;
            box-shadow: 0 4px 12px rgba(163, 142, 98, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-white/80 backdrop-blur border-b border-cream-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-user-nurse"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-bold text-accentDark">11511 護理班表管理系統</h1>
                        <span class="text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full">114年11月</span>
                    </div>
                    <p class="text-xs text-stone-500">奶油色系 • 人員與班別精準對照</p>
                </div>
            </div>
            
            <button onclick="window.print()" class="px-4 py-2 bg-cream-100 hover:bg-cream-200 text-accentDark rounded-xl text-sm font-medium transition flex items-center gap-2 border border-cream-300">
                <i class="fa-solid fa-print"></i> 列印班表
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-5xl mx-auto px-4 mt-2">
            <div class="flex space-x-2 border-b border-cream-200">
                <button id="tab-daily" onclick="switchTab('daily')" class="py-2.5 px-4 font-semibold text-sm border-b-2 border-amber-600 text-amber-800 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-day"></i> 每日班表
                </button>
                <button id="tab-personal" onclick="switchTab('personal')" class="py-2.5 px-4 font-medium text-sm text-stone-500 hover:text-stone-800 border-b-2 border-transparent flex items-center gap-2">
                    <i class="fa-solid fa-id-card"></i> 個人班表
                </button>
                <button id="tab-legend" onclick="switchTab('legend')" class="py-2.5 px-4 font-medium text-sm text-stone-500 hover:text-stone-800 border-b-2 border-transparent flex items-center gap-2">
                    <i class="fa-solid fa-book"></i> 班別代碼
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">

        <!-- Controls: Search & Filter -->
        <div class="cream-card p-4 rounded-2xl mb-6 flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋護理人員姓名或職編..." class="w-full pl-10 pr-4 py-2 bg-cream-50 border border-cream-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50">
            </div>
            <div id="dateSelector" class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="changeDate(-1)" class="w-9 h-9 flex items-center justify-center bg-cream-50 border border-cream-200 rounded-xl hover:bg-cream-100 text-stone-600">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <input type="date" id="selectedDate" value="2025-11-01" min="2025-11-01" max="2025-11-30" onchange="renderDailyView()" class="bg-cream-50 border border-cream-200 px-3 py-1.5 rounded-xl text-sm font-semibold text-accentDark focus:outline-none">
                <button onclick="changeDate(1)" class="w-9 h-9 flex items-center justify-center bg-cream-50 border border-cream-200 rounded-xl hover:bg-cream-100 text-stone-600">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- VIEW 1: DAILY ROSTER -->
        <div id="view-daily" class="space-y-6">
            <div id="dailyShiftContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic Content Load -->
            </div>
        </div>

        <!-- VIEW 2: PERSONAL CARDS -->
        <div id="view-personal" class="hidden space-y-6">
            <div id="personalCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic Content Load -->
            </div>
        </div>

        <!-- VIEW 3: LEGEND -->
        <div id="view-legend" class="hidden">
            <div class="cream-card rounded-2xl p-6">
                <h3 class="text-lg font-bold text-accentDark mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-amber-600"></i> 護理班別代碼與出勤時間說明
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">85</span>
                        <span class="text-stone-700">08:00 - 16:30 (白班)</span>
                    </div>
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">8-4'</span>
                        <span class="text-stone-700">08:00 - 16:30 (白班)</span>
                    </div>
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">8'-5</span>
                        <span class="text-stone-700">08:00 - 17:00 (白班)</span>
                    </div>
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">9-5'</span>
                        <span class="text-stone-700">09:00 - 17:30 (白班)</span>
                    </div>
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">9'-6</span>
                        <span class="text-stone-700">09:30 - 18:00 (白班)</span>
                    </div>
                    <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                        <span class="font-bold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded mr-2">10-6'</span>
                        <span class="text-stone-700">10:00 - 18:30 (白班)</span>
                    </div>
                    <div class="p-3 bg-purple-50/50 rounded-xl border border-purple-200/60">
                        <span class="font-bold text-purple-900 bg-purple-200/70 px-2 py-0.5 rounded mr-2">3'-12</span>
                        <span class="text-stone-700">15:30 - 24:00 (小夜班)</span>
                    </div>
                    <div class="p-3 bg-purple-50/50 rounded-xl border border-purple-200/60">
                        <span class="font-bold text-purple-900 bg-purple-200/70 px-2 py-0.5 rounded mr-2">4-12'</span>
                        <span class="text-stone-700">16:00 - 00:30 (小夜班)</span>
                    </div>
                    <div class="p-3 bg-indigo-50/50 rounded-xl border border-indigo-200/60">
                        <span class="font-bold text-indigo-900 bg-indigo-200/70 px-2 py-0.5 rounded mr-2">PH</span>
                        <span class="text-stone-700">00:00 - 08:30 (大夜班)</span>
                    </div>
                    <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-200/60">
                        <span class="font-bold text-emerald-900 bg-emerald-200/70 px-2 py-0.5 rounded mr-2">FF</span>
                        <span class="text-stone-700">例假</span>
                    </div>
                    <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-200/60">
                        <span class="font-bold text-emerald-900 bg-emerald-200/70 px-2 py-0.5 rounded mr-2">WW</span>
                        <span class="text-stone-700">休假</span>
                    </div>
                    <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-200/60">
                        <span class="font-bold text-emerald-900 bg-emerald-200/70 px-2 py-0.5 rounded mr-2">VV</span>
                        <span class="text-stone-700">特休</span>
                    </div>
                </div>
            </div>
        </div>

    </main>
